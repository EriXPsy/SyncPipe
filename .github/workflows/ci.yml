name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly full-suite run (includes the slow validation layer).
  schedule:
    - cron: "17 4 * * *"

jobs:
  # PR / push gate: everything EXCEPT the slow validation layer.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m build --wheel
      - run: pytest tests/ -m "not slow" -q --tb=short

  # Full suite (slow validation layer included). Runs only on push to main
  # or the nightly schedule -- never on ordinary PRs.
  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q --tb=short

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m syncpipe demo --surrogates 20 --audit-surrogates 99 --demo-dyads 4 --no-prediction -o artifacts/ci_demo
      - run: test -f artifacts/ci_demo/viewer_results.json
      - run: test -f artifacts/ci_demo/DEMO_REPORT.md
